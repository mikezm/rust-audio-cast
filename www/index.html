<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>Audio Cast</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <!-- MAIN VIEW -->
      <section id="view-main" class="view">
        <header class="topbar">
          <button id="find-btn" class="findbtn">Speakers ›</button>
          <span id="nowon-name" class="nowon">No speaker</span>
          <span id="state-badge" class="badge badge--idle">idle</span>
        </header>

        <div class="transport">
          <button id="play-btn" class="bigbtn bigbtn--play" disabled>
            <span class="bigbtn__glyph">▶</span><span>Play</span>
          </button>
          <button id="stop-btn" class="bigbtn bigbtn--stop" disabled>
            <span class="bigbtn__glyph">■</span><span>Stop</span>
          </button>
        </div>

        <div class="volume">
          <button id="mute-btn" class="mutebtn">Mute</button>
          <input
            id="volume-slider"
            class="slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            aria-label="Volume"
          />
          <span id="volume-label" class="volume__label">0%</span>
        </div>
      </section>

      <!-- SPEAKER PICKER VIEW -->
      <section id="view-speakers" class="view view--hidden">
        <header class="topbar">
          <button id="back-btn" class="iconbtn" aria-label="Back">‹</button>
          <h1>Speakers</h1>
          <button id="refresh-btn" class="iconbtn" aria-label="Rescan">⟳</button>
        </header>
        <ul id="device-list" class="devices" aria-label="Speakers">
          <li class="devices__empty">Tap ⟳ to scan.</li>
        </ul>
      </section>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>

      <!-- Idle blackout overlay (kiosk only). Hidden by default; shown after
           the inactivity timeout, dismissed by the next touch. -->
      <div id="screensaver" class="screensaver" hidden></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
