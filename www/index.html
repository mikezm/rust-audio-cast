<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Audio Cast</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1>Audio&nbsp;Cast</h1>
        <span id="state-badge" class="badge badge--idle">idle</span>
      </header>

      <section class="panel">
        <div class="panel__head">
          <h2>Speaker</h2>
          <button id="refresh-btn" class="iconbtn" title="Rescan for speakers" aria-label="Rescan">⟳</button>
        </div>
        <ul id="device-list" class="devices" aria-label="Speakers">
          <li class="devices__empty">Searching for speakers…</li>
        </ul>
      </section>

      <section class="controls">
        <button id="play-btn" class="bigbtn bigbtn--play" disabled>
          <span class="bigbtn__glyph">▶</span><span>Play</span>
        </button>
        <button id="stop-btn" class="bigbtn bigbtn--stop" disabled>
          <span class="bigbtn__glyph">■</span><span>Stop</span>
        </button>
      </section>

      <section class="panel volume">
        <div class="panel__head">
          <h2>Volume</h2>
          <span id="volume-label" class="volume__label">0%</span>
        </div>
        <div class="volume__row">
          <button id="mute-btn" class="iconbtn iconbtn--wide">Mute</button>
          <input
            id="volume-slider"
            class="slider"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            aria-label="Volume"
          />
        </div>
      </section>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
