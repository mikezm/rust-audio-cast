# Sample configuration. Copy to config.local.toml or /etc/audiocast/config.toml
# and edit, or set AUDIOCAST_CONFIG to point at a file. All fields are optional;
# omitted values fall back to these defaults.

# Substring matched against the input device name to pick the turntable input.
# With the cpal/ALSA capture backend this is an ALSA PCM name, NOT a friendly
# string: run once with `audio = "capture"` and read the `available=[...]`
# warning to see the candidates. `plughw:CARD=<name>` is the most forgiving
# (it auto-converts sample format/rate/channels).
usb_device_name = "plughw:CARD=CODEC"

# Address the HTTP server binds to. Use 0.0.0.0:80 on the Pi (with
# CAP_NET_BIND_SERVICE); 8080 is a convenient default for local dev.
bind_addr = "0.0.0.0:8080"

# Capture format.
sample_rate = 44100
channels = 2

# Control/discovery backend:
#   "fake" — in-memory cast + static device list (no hardware).
#   "live" — real Chromecast control (rust_cast) + LAN discovery (mdns-sd).
# Override at runtime with AUDIOCAST_BACKEND=live.
backend = "fake"

# Audio source (chosen independently of `backend`):
#   "synthetic" — 440 Hz test tone, no USB device needed.
#   "capture"   — real USB capture via cpal/ALSA (uses `usb_device_name` above).
# Override at runtime with AUDIOCAST_AUDIO=capture.
audio = "synthetic"

# How long an mDNS discovery sweep runs.
discovery_timeout_secs = 4

# Directory the static touch UI is served from. Relative paths resolve against
# the process working directory, so for the systemd service use an absolute path
# (the installer sets this to /usr/share/audiocast/www).
web_root = "www"

# Auto-stop casting after this many seconds of continuous input silence (e.g.
# the record has finished and is spinning in the end groove). 0 disables.
silence_stop_secs = 120

# RMS level (fraction of full scale, 0.0–1.0) below which a second of input
# counts as silent. 0.005 ≈ -46 dBFS: above a turntable's noise floor picked
# up between records, comfortably below any program material. Raise it if a
# noisy input never triggers auto-stop; lower it if quiet passages do.
silence_threshold = 0.005

# Optional: pre-select a Chromecast by UUID on startup.
# default_cast_uuid = ""

# Optional: override the IP advertised in the stream URL. If unset, the local
# IP is auto-detected.
# advertised_ip = "192.168.1.50"
