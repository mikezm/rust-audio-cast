[package]
name = "domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure domain core: entities, value objects, and ports. No I/O, no async runtime."

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
mockall = { workspace = true, optional = true }

[features]
# Generates Mock* implementations of the ports for use in downstream tests.
mock = ["dep:mockall"]
